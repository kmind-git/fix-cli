profile = "broker-a-uat"
runtime_mode = "certification"
database = "../../data/broker-a-uat.redb"
audit_key_file = "../../secrets/audit.key.example"
dictionary = "./dictionary/fix44-mock.json"
dictionary_sha256 = "64aecf84358d5fd60c142724c3ff4dc3cf5920ea2c67b34fa170abe004214e60"

[transport]
host = "127.0.0.1"
port = 19876
security = "plaintext_cert"
connect_timeout_ms = 1000
reconnect_initial_ms = 250
reconnect_max_ms = 5000

[session]
begin_string = "FIX.4.4"
sender_comp_id = "CLIENT"
target_comp_id = "SERVER"
heartbeat_interval_secs = 30
# logon_fields_file = "../../secrets/logon-fields.json"

[policy]
allowed_symbols = ["IBM", "MSFT"]
max_quantity = "1000"
max_notional = "1000000"
allow_market_orders = false
max_messages_per_second = 10
