# fixd 连接本地 mock 的客户端配置（与 config/mock/SERVER.CFG 对应：
# 发送方=CLIENT，接收方=SERVER，端口 19876）
# 启动：fixd run-real --cfg config/mock/CLIENT.CFG

[DEFAULT]
ReconnectInterval=10
LogLocalTime=Y
WorkingLocalTime=Y
FileLogPath=./logs/mock/c_log
StartTime=06:00:00
EndTime=05:30:00
UseDataDictionary=N

[client]
BeginString=FIX.4.4
TargetCompID=SERVER
SenderCompID=CLIENT
ConnectionType=initiator
SocketConnectHost=127.0.0.1
SocketConnectPort=19876
HeartBtInt=30
ResetSeqNumFlag=Y
