# 这里相当于是全局性的配置，DEFAULT 节的配置会影响所有会话！当然如果针对同一个配置项
# DEFAULT 节和某个特定会话均有配置，则以特定会话自己的配置为准
# 启动 mock：fix-mock --cfg config/mock/SERVER.CFG

[DEFAULT]
LogLocalTime=Y
WorkingLocalTime=Y

# 日志路径的配置，注意：这里的路径是相对路径，对于经常会变更工作目录的应用
# 建议使用绝对路径配置！！！
FileLogPath=./logs/mock/s_log
# GlobalLogPath 仅全局有效，特定会话无法配置自己的GlobalLogPath！！
GlobalLogPath=./log/s_global

# 业务自行根据市场特点配置合适的工作时间！！！！
StartTime=06:50:00
EndTime=06:30:00

UseDataDictionary=Y
DataDictionary=config/FIX44.xml
ValidUnSupportFieldType=N

# 以下是配置消息解析的例外，对于严格符合FIX规范的引擎，可以删除下列所有例外配置，
# 否则可以根据实际情况有选择的使用某几个配置项
ValidateFieldsHaveValues=Y
ValidateUserDefinedFields=N
ValidateUnDefinedFields=N
ValidateUnDefinedUserFieldValue=Y
ValidateUnDefinedFieldValue=Y

# 以下配置决定当底层通信阻塞时是等待一段时间还是立即返回失败
SendWaitTime=6000
SendBlock=Y

# mock 监听会话：只允许一个会话节，端口/CompID 与 config/CLIENT.CFG 对应
# （发送方=SERVER，接收方=CLIENT）
[server]
ConnectionType=acceptor
BeginString=FIX.4.4
SenderCompID=SERVER
TargetCompID=CLIENT
SocketAcceptHost=127.0.0.1
SocketAcceptPort=19876
HeartBtInt=30
